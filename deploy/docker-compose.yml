# Local development stack: PostgreSQL, a mail catcher and the auth service (with the development manifest, deploy/auth.yaml).
#
# Compose looks for .env next to this file (deploy/), not in the repo root, so always pass the
# repo-root file explicitly (the e2e script does this for you):
#
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
#
# Needs .env (copy .env.example) and .secrets/ (scripts/dev-keys.sh). Development only.
name: auth-core

services:
  postgres:
    # The tag says which release, the digest says which bytes (the same image as the notes sample's database job).
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (copy .env.example)}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP (-h): on a fresh volume the image runs a temporary init server that listens on its socket only and would pass a socket check.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U auth -d auth"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    # A mail catcher: the auth service sends to it over SMTP, the e2e script reads the mails from its HTTP API.
    # Its API is unauthenticated: development only, on loopback (spec 0008).
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    ports:
      # Loopback only: the web UI and the API (http://localhost:8025). SMTP (1025) stays inside the compose network.
      - "127.0.0.1:8025:8025"

  auth:
    build:
      context: ..
      dockerfile: src/Auth.Server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      # Loopback only: Development enables the developer exception page and a seeded user, so never LAN-expose it.
      - "127.0.0.1:8080:8080"
    environment:
      # Development enables the dev seed user and migrate-on-startup (see appsettings.Development.json).
      ASPNETCORE_ENVIRONMENT: Development
      # "GSS Encryption Mode=Disable": the image has no Kerberos library, and without it Npgsql probes for one and prints
      # "Cannot load library libgssapi_krb5.so.2" at every start and from every admin command. Nothing here uses GSS.
      ConnectionStrings__Auth: Host=postgres;Port=5432;Database=auth;Username=auth;GSS Encryption Mode=Disable;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      Auth__DevSeed__Email: ${AUTH_DEV_SEED_EMAIL:?set AUTH_DEV_SEED_EMAIL in .env}
      Auth__DevSeed__Password: ${AUTH_DEV_SEED_PASSWORD:?set AUTH_DEV_SEED_PASSWORD in .env}
      # Optional second seed user with an unconfirmed email (spec 0004); scripts/e2e-email.sh needs it.
      Auth__DevSeed__UnverifiedEmail: ${AUTH_DEV_SEED_UNVERIFIED_EMAIL:-}
      Auth__DevSeed__UnverifiedPassword: ${AUTH_DEV_SEED_UNVERIFIED_PASSWORD:-}
      Auth__Email__Smtp__Host: mailpit
      # The product's manifest (spec 0005): its permissions and the default roles of a new company. A product mounts its own.
      Auth__Manifest__Path: /etc/auth-core/auth.yaml
      Auth__Keys__SigningCertificatePath: /run/secrets/auth/signing.crt
      Auth__Keys__SigningKeyPath: /run/secrets/auth/signing.key
      Auth__Keys__EncryptionCertificatePath: /run/secrets/auth/encryption.crt
      Auth__Keys__EncryptionKeyPath: /run/secrets/auth/encryption.key
      # The per-IP limits of spec 0008 (30 logins, 60 refreshes, 10 mail requests, 20 invitation requests and 300 other requests per
      # minute and address) and how long the audit log keeps a row (90 days). A blank value is the default. Some of the older e2e
      # scripts exceed the limits on purpose: run them with AUTH_RATE_LIMIT_ENABLED=false (see the header of each script).
      Auth__RateLimit__Enabled: ${AUTH_RATE_LIMIT_ENABLED:-true}
      Auth__RateLimit__Login__PermitPerMinute: ${AUTH_RATE_LIMIT_LOGIN:-}
      Auth__RateLimit__Refresh__PermitPerMinute: ${AUTH_RATE_LIMIT_REFRESH:-}
      Auth__RateLimit__Email__PermitPerMinute: ${AUTH_RATE_LIMIT_EMAIL:-}
      Auth__RateLimit__Invite__PermitPerMinute: ${AUTH_RATE_LIMIT_INVITE:-}
      Auth__RateLimit__General__PermitPerMinute: ${AUTH_RATE_LIMIT_GENERAL:-}
      Auth__Audit__RetentionDays: ${AUTH_AUDIT_RETENTION_DAYS:-}
    volumes:
      - ../.secrets:/run/secrets/auth:ro
      - ./auth.yaml:/etc/auth-core/auth.yaml:ro
    # No healthcheck: the chiseled image has no shell or curl. scripts/e2e-login.sh polls /auth/health from the host.

volumes:
  postgres-data:
