# A throwaway test overlay for deploy/docker-compose.prod.yml (spec 0008): used by scripts/e2e-prod.sh, never in production.
#
# It adds what a production host has outside this repository: an SMTP relay that REQUIRES STARTTLS and whose certificate comes from a test
# authority, which the auth container trusts through SSL_CERT_FILE (the chiseled image has no tools to install one), a small static server
# for that authority's certificate revocation list (MailKit checks revocation by default and no setting of the service turns that off),
# and a reverse proxy on https://localhost:8443 (Caddy, `tls internal`: a browser warns, the script accepts it). The proxy is on the "proxy" network of the
# production file, whose subnet the script tells Auth-Core to trust for the client address.
#
#   docker compose -p auth-core-prodtest -f deploy/docker-compose.prod.yml -f scripts/prod-test.compose.yml --env-file <env made by the script> up -d
#
# The directory in E2E_PROD_PKI_DIR is made by the script: ca.crt (the test authority's certificate, for the auth container), relay/ (the
# certificate and key of the relay, for Mailpit) and crl/ (the list, for the pki service). The authority's key stays in the directory itself and
# is mounted nowhere. Every mount is a read-only bind with create_host_path: false: a missing path stops the start instead of becoming an
# empty directory.
services:
  mailpit:
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    environment:
      MP_SMTP_TLS_CERT: /pki/mailpit.crt
      MP_SMTP_TLS_KEY: /pki/mailpit.key
      # A client that does not start TLS gets no mail through: the arrival of a mail proves the handshake.
      MP_SMTP_REQUIRE_STARTTLS: "true"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
    volumes:
      - type: bind
        source: ${E2E_PROD_PKI_DIR:?set by scripts/e2e-prod.sh}/relay
        target: /pki
        read_only: true
        bind:
          create_host_path: false
    ports:
      # The API the script reads the mails from. Loopback only.
      - "127.0.0.1:8025:8025"
    networks:
      - auth

  pki:
    # Serves the (empty) certificate revocation list of the test authority at http://pki.test/ca.crl, the address in the
    # certificate of Mailpit. Without a distribution point the revocation status of the certificate is unknown, and MailKit, which
    # checks revocation by default, refuses the handshake. Only the list is mounted, never the authority's key. The access log
    # (stderr) shows whether the service really fetched the list: scripts/e2e-prod.sh reads it.
    image: caddy:2.11.7@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
    command: ["caddy", "file-server", "--root", "/crl", "--listen", ":80", "--access-log"]
    user: "10002:10002"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # the binary of the image carries this file capability: without it in the set, it does not start
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /data:mode=1777
      - /config:mode=1777
    volumes:
      - type: bind
        source: ${E2E_PROD_PKI_DIR:?set by scripts/e2e-prod.sh}/crl
        target: /crl
        read_only: true
        bind:
          create_host_path: false
    networks:
      auth:
        aliases:
          - pki.test

  caddy:
    image: caddy:2.11.7@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
    user: "10002:10002"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # the binary of the image carries this file capability: without it in the set, it does not start
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /data:mode=1777
      - /config:mode=1777
    depends_on:
      auth:
        condition: service_started
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - type: bind
        source: ${E2E_PROD_CADDYFILE:?set by scripts/e2e-prod.sh}
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
    networks:
      - proxy

  auth:
    depends_on:
      mailpit:
        condition: service_started
      pki:
        condition: service_started
    environment:
      # The test authority that signed Mailpit's certificate. It replaces the system's authorities for this container.
      SSL_CERT_FILE: /pki/ca.crt
    volumes:
      - type: bind
        source: ${E2E_PROD_PKI_DIR:?set by scripts/e2e-prod.sh}/ca.crt
        target: /pki/ca.crt
        read_only: true
        bind:
          create_host_path: false
