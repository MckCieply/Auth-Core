# The "notes" sample and a Caddy proxy on top of the development stack. Use it with the base file:
#
#   docker compose -f deploy/docker-compose.yml -f samples/notes-api/compose.yml --env-file .env up -d --build
#
# Relative paths in this file are resolved from deploy/ (the directory of the FIRST -f file), not from here.
# Needs NOTES_DB_PASSWORD in .env (see .env.example). The browser's origin is http://localhost:8088:
#   /auth -> Auth-Core, /api -> the notes service. The notes service publishes no port; Auth-Core's own port stays
#   published on loopback by the base file (development only).
services:
  notes-db-init:
    # One-shot and idempotent: creates the login "notes" and the database "notes" on the stack's PostgreSQL server,
    # or sets the password again when they exist. (An init script of the postgres image runs on a fresh volume only.)
    # It also takes CONNECT on Auth-Core's database "auth" and on the maintenance databases "postgres" and "template1" away
    # from PUBLIC, so that the login "notes" can open its own database and no other; the owner "auth" (a superuser) is not
    # affected, nor is pg_isready (it does not log in). The revokes stay in the volume, also when this overlay is dropped.
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: auth
      PGDATABASE: auth
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (copy .env.example)}
      NOTES_DB_PASSWORD: ${NOTES_DB_PASSWORD:?set NOTES_DB_PASSWORD in .env (copy .env.example)}
    entrypoint: ["sh", "-ec"]
    command:
      - |
        psql -v ON_ERROR_STOP=1 -v pw="$$NOTES_DB_PASSWORD" <<'SQL'
        SELECT format('CREATE ROLE notes LOGIN PASSWORD %L', :'pw')
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'notes') \gexec
        ALTER ROLE notes PASSWORD :'pw';
        SELECT 'CREATE DATABASE notes OWNER notes'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'notes') \gexec
        REVOKE CONNECT ON DATABASE auth FROM PUBLIC;
        REVOKE CONNECT ON DATABASE postgres FROM PUBLIC;
        REVOKE CONNECT ON DATABASE template1 FROM PUBLIC;
        SQL

  notes-api:
    build:
      context: ..
      dockerfile: samples/notes-api/Dockerfile
    depends_on:
      notes-db-init:
        condition: service_completed_successfully
    environment:
      # The same issuer and audience as Auth-Core below; the keys are fetched over the internal network.
      AUTH_ISSUER: http://localhost:8088/auth
      AUTH_AUDIENCE: notes-api
      AUTH_JWKS_URL: http://auth:8080/auth/.well-known/jwks.json
      DATABASE_URL: postgresql+psycopg://notes:${NOTES_DB_PASSWORD:?set NOTES_DB_PASSWORD in .env}@postgres:5432/notes
    # Reachable from the other containers (Caddy), not published on the host.
    expose:
      - "8000"
    healthcheck:
      # Python's standard library, as the image has no curl. A 503 from the health endpoint is a failed check too.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  caddy:
    # The tag says which release, the digest says which bytes: the image cannot change under the tag.
    image: caddy:2.11.7@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
    # Not root, nothing writable but memory: a fixed user, a read-only root filesystem, and the two directories Caddy writes
    # to are in memory and writable by it. No capability but the one the image's binary is marked with (see below), and no
    # way to gain more.
    user: "10002:10002"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # the binary of the image carries this file capability: without it in the set, it does not start
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /data:mode=1777
      - /config:mode=1777
    depends_on:
      auth:
        condition: service_started
      notes-api:
        condition: service_healthy
    ports:
      # Loopback only, like every other port of this stack.
      - "127.0.0.1:8088:8088"
    networks:
      default:
        # A fixed address, so that Auth-Core can be told which proxy to believe about the client address (see `auth` below).
        ipv4_address: ${NOTES_PROXY_IP:-10.250.2.10}
    volumes:
      - ../samples/notes-api/Caddyfile:/etc/caddy/Caddyfile:ro

  auth:
    environment:
      # Tokens name the origin the browser uses, and are for the notes service.
      Auth__Tokens__Issuer: http://localhost:8088/auth
      Auth__Tokens__Audience: notes-api
      # The proxy in front of Auth-Core in this stack, and nothing else, is believed about the client address (spec 0008): a network of
      # the one address Caddy has. A request that reaches Auth-Core's own port from the host is taken as it comes.
      Auth__Proxy__KnownNetworks__0: ${NOTES_PROXY_IP:-10.250.2.10}/32
    volumes:
      # The same container path as in the base file: this mount replaces the development manifest.
      - ../samples/notes-api/auth.yaml:/etc/auth-core/auth.yaml:ro

networks:
  default:
    ipam:
      config:
        # A fixed subnet for the project's network, so that the proxy's address above is in it. Change both (NOTES_SUBNET and
        # NOTES_PROXY_IP in .env) if another network of yours already uses this range.
        - subnet: ${NOTES_SUBNET:-10.250.2.0/24}
